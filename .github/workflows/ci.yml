name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: substream
          POSTGRES_PASSWORD: substream
          POSTGRES_DB: substream
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U substream"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://substream:substream@localhost:5432/substream
      AUTH_SECRET: ci-secret-0123456789abcdef0123456789
      AUTH_TRUST_HOST: "true"
      AUTH_LOG_MAGIC_LINKS: "true"
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:styles
      - run: npm run typecheck
      - run: npm test
      # Until the first migration is committed, sync the schema directly.
      - run: npx prisma db push
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
