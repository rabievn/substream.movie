# Local PostgreSQL for development: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: substream
      POSTGRES_PASSWORD: substream
      POSTGRES_DB: substream
    ports:
      - "5432:5432"
    volumes:
      - substream-db:/var/lib/postgresql/data

volumes:
  substream-db:
